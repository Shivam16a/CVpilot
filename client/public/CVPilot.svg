<svg xmlns="http://www.w3.org/2000/svg" viewBox="240 140 760 700" width="100%" height="100%">
  <defs>
    <!-- Main blue/purple/orange gradient -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008FEF"/>
      <stop offset="35%" stop-color="#3047E8"/>
      <stop offset="65%" stop-color="#9B20E8"/>
      <stop offset="85%" stop-color="#F52E8B"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>

    <!-- Top blue gradient -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#176BEA"/>
      <stop offset="55%" stop-color="#008FEF"/>
      <stop offset="100%" stop-color="#18B9E8"/>
    </linearGradient>

    <!-- Orange gradient -->
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F23C21"/>
      <stop offset="48%" stop-color="#FF7510"/>
      <stop offset="100%" stop-color="#FFAE16"/>
    </linearGradient>
  </defs>

  <!-- ========================= -->
  <!-- BOLD MAIN CIRCULAR C-SHAPE -->
  <!-- ========================= -->
  <path
    d="
      M 842 344
      C 806 254 704 194 602 194
      C 425 194 286 330 286 493
      C 286 651 402 774 557 784
      C 642 790 716 763 775 710
      L 700 625
      C 658 658 607 676 554 673
      C 456 668 388 595 388 496
      C 388 397 470 312 574 301
      C 672 291 752 327 798 393
      Z"
    fill="url(#mainGradient)"
  />

  <!-- Upper blue swoosh -->
  <path
    d="
      M 469 389
      C 518 317 599 293 684 293
      C 757 293 823 321 857 365
      C 874 387 867 405 846 421
      C 823 439 795 450 768 452
      C 746 454 731 446 713 432
      C 666 394 613 366 558 365
      C 523 365 493 374 469 389
      Z"
    fill="url(#blueGradient)"
  />

  <!-- Orange lower swoosh -->
  <path
    d="
      M 558 631
      C 616 658 674 641 722 598
      L 781 541
      C 808 515 832 495 858 496
      C 893 497 918 520 922 550
      C 929 606 887 674 839 719
      C 783 773 704 800 618 799
      C 541 798 469 772 418 726
      C 459 754 513 758 558 743
      C 611 726 651 697 682 661
      C 648 674 604 672 558 631
      Z"
    fill="url(#orangeGradient)"
  />

  <!-- Centered White Document Sheet with High Contrast -->
  <g transform="translate(615, 495)">
    <!-- White Sheet Background -->
    <rect
      x="-66"
      y="-94"
      width="132"
      height="176"
      rx="20"
      fill="#FFFFFF"
      stroke="#0f172a"
      stroke-width="12"/>

    <!-- Folded Corner -->
    <path
      d="M 22 -94 L 66 -50 L 22 -50 Z"
      fill="#93c5fd"/>
    <path
      d="M 22 -94 L 22 -50 L 66 -50"
      fill="none"
      stroke="#0f172a"
      stroke-width="8"
      stroke-linejoin="round"/>

    <!-- Bold Content Lines -->
    <rect x="-38" y="-18" width="76" height="14" rx="7" fill="#008FEF"/>
    <rect x="-38" y="10" width="62" height="14" rx="7" fill="#3047E8"/>
    <rect x="-38" y="38" width="48" height="14" rx="7" fill="#F52E8B"/>
  </g>

  <!-- Large Vivid Sparkles -->
  <path
    d="M 885 220 C 895 248 908 261 936 269 C 908 277 895 290 885 318 C 875 290 862 277 834 269 C 862 261 875 248 885 220 Z"
    fill="#00D2FF"
  />
  <path
    d="M 945 315 C 952 334 961 343 980 348 C 961 353 952 362 945 381 C 938 362 929 353 910 348 C 929 343 938 334 945 315 Z"
    fill="#FF7A00"
  />
</svg>
