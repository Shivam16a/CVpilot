<svg width="1200" height="1200" viewBox="0 0 1200 1200"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Main blue/purple/orange gradient -->
    <linearGradient id="mainGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008FEF"/>
      <stop offset="38%" stop-color="#3047E8"/>
      <stop offset="62%" stop-color="#9B20E8"/>
      <stop offset="82%" stop-color="#F52E8B"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>

    <!-- Top blue gradient -->
    <linearGradient id="blueGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="80%">
      <stop offset="0%" stop-color="#176BEA"/>
      <stop offset="55%" stop-color="#008FEF"/>
      <stop offset="100%" stop-color="#18B9E8"/>
    </linearGradient>

    <!-- Orange gradient -->
    <linearGradient id="orangeGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F23C21"/>
      <stop offset="48%" stop-color="#FF7510"/>
      <stop offset="100%" stop-color="#FFAE16"/>
    </linearGradient>

    <!-- Small C gradient -->
    <linearGradient id="cGradient"
                    x1="10%" y1="0%"
                    x2="90%" y2="100%">
      <stop offset="0%" stop-color="#087CEB"/>
      <stop offset="42%" stop-color="#343CE8"/>
      <stop offset="70%" stop-color="#E92D9D"/>
      <stop offset="100%" stop-color="#FF8A0A"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="blurShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- ========================= -->
  <!-- ICON -->
  <!-- ========================= -->

  <!-- Main circular C shape -->
  <path
    d="
      M 842 344
      C 806 254 704 194 602 194
      C 425 194 286 330 286 493
      C 286 651 402 774 557 784
      C 642 790 716 763 775 710
      L 700 625
      C 658 658 607 676 554 673
      C 456 668 388 595 388 496
      C 388 397 470 312 574 301
      C 672 291 752 327 798 393
      Z"
    fill="url(#mainGradient)"
  />

  <!-- Upper blue swoosh -->
  <path
    d="
      M 469 389
      C 518 317 599 293 684 293
      C 757 293 823 321 857 365
      C 874 387 867 405 846 421
      C 823 439 795 450 768 452
      C 746 454 731 446 713 432
      C 666 394 613 366 558 365
      C 523 365 493 374 469 389
      Z"
    fill="url(#blueGradient)"
  />

  <!-- Orange lower swoosh -->
  <path
    d="
      M 558 631
      C 616 658 674 641 722 598
      L 781 541
      C 808 515 832 495 858 496
      C 893 497 918 520 922 550
      C 929 606 887 674 839 719
      C 783 773 704 800 618 799
      C 541 798 469 772 418 726
      C 459 754 513 758 558 743
      C 611 726 651 697 682 661
      C 648 674 604 672 558 631
      Z"
    fill="url(#orangeGradient)"
  />

  <!-- Large Note Icon -->
<g transform="translate(610 500)">

  <!-- Note Shadow -->
  <rect
    x="-62"
    y="-78"
    width="124"
    height="156"
    rx="16"
    fill="#E8EBFF"
    opacity="0.65"/>

  <!-- Main Note -->
  <rect
    x="-56"
    y="-84"
    width="112"
    height="150"
    rx="14"
    fill="#FFFFFF"
    stroke="#24347F"
    stroke-width="8"/>

  <!-- Folded Corner -->
  <path
    d="
      M 18 -84
      L 56 -46
      L 18 -46
      Z"
    fill="#DDE3FF"/>

  <!-- Fold Border -->
  <path
    d="
      M 18 -84
      L 18 -46
      L 56 -46"
    fill="none"
    stroke="#24347F"
    stroke-width="5"
    stroke-linejoin="round"/>

  <!-- Note Lines -->
  <rect
    x="-31"
    y="-17"
    width="62"
    height="8"
    rx="4"
    fill="#24347F"/>

  <rect
    x="-31"
    y="5"
    width="50"
    height="8"
    rx="4"
    fill="#24347F"/>

  <rect
    x="-31"
    y="27"
    width="38"
    height="8"
    rx="4"
    fill="#24347F"/>

  <!-- Small Check Mark -->
  <path
    d="M -30 52 L -18 63 L 5 40"
    fill="none"
    stroke="#2878E8"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"/>

</g>



  <!-- Sparkles -->
  <path
    d="M 901 231
       C 907 253 918 263 941 269
       C 918 275 907 285 901 308
       C 895 285 884 275 861 269
       C 884 263 895 253 901 231 Z"
    fill="#1675E8"
  />

  <path
    d="M 959 305
       C 963 319 970 326 984 330
       C 970 334 963 341 959 356
       C 955 341 948 334 934 330
       C 948 326 955 319 959 305 Z"
    fill="#7133E8"
  />

  <path
    d="M 916 356
       C 921 372 929 380 945 384
       C 929 388 921 396 916 412
       C 911 396 903 388 887 384
       C 903 380 911 372 916 356 Z"
    fill="#FF6A16"
  />

  <!-- ========================= -->
  <!-- TEXT / WORDMARK -->
  <!-- ========================= -->

  <!-- C -->
  <path
    d="
      M 384 835
      C 355 807 315 792 273 792
      C 195 792 136 850 136 924
      C 136 997 195 1055 273 1055
      C 317 1055 357 1040 384 1011
      L 350 978
      C 330 997 305 1007 276 1007
      C 224 1007 185 970 185 924
      C 185 877 224 840 276 840
      C 306 840 330 850 350 869
      Z"
    fill="url(#cGradient)"
  />

  <!-- vpilot text -->
  <text
  x="392"
  y="1010"
  font-family="Arial, Helvetica, sans-serif"
  font-size="205"
  font-weight="700"
  letter-spacing="-12"
  fill="#111E5E">
  VPilot
</text>


  <!-- Gradient dot above i -->
  <circle
    cx="718"
    cy="838"
    r="18"
    fill="url(#mainGradient)"
  />

  <!-- Ground shadow -->
  <ellipse
    cx="623"
    cy="1092"
    rx="245"
    ry="18"
    fill="#BFAEFF"
    opacity="0.25"
    filter="url(#blurShadow)"
  />

</svg>
