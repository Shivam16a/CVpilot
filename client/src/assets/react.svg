<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Deep Cosmic Obsidian Tile -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Electric Horizon Gradient (Top Primary Ascent) -->
    <linearGradient id="topAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Future Violet/Indigo Gradient (Counter Balance Loop) -->
    <linearGradient id="bottomAura" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Core AI Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Icon Plate -->
  <rect width="512" height="512" rx="124" fill="url(#bgGlow)"/>
  <rect width="506" height="506" x="3" y="3" rx="121" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="3"/>

  <!-- Iconic Pure Abstract Geometry: Dual Horizon Loop -->
  <g filter="url(#softGlow)">
    <!-- Primary Upper Elevation Crescent -->
    <path 
      d="M136 296C136 207.634 207.634 136 296 136C356.46 136 409.08 169.57 436 218C424 212 406 208 388 208C317.307 208 260 265.307 260 336C260 354 264 372 270 384C221.57 357.08 136 348 136 296Z" 
      fill="url(#topAura)"
    />

    <!-- Intersecting Kinetic Guidance Wing -->
    <path 
      d="M376 216C376 304.366 304.366 376 216 376C155.54 376 102.92 342.43 76 294C88 300 106 304 124 304C194.693 304 252 246.693 252 176C252 158 248 140 242 128C290.43 154.92 376 164 376 216Z" 
      fill="url(#bottomAura)" 
      fill-opacity="0.95"
      style="mix-blend-mode: screen;"
    />

    <!-- The Guidance Spark / North Star Nucleus -->
    <circle cx="256" cy="256" r="28" fill="#ffffff"/>
    <circle cx="256" cy="256" r="14" fill="#38bdf8"/>
  </g>
</svg>
